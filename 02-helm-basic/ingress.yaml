# Applied directly with kubectl, not part of the chart: one Ingress doing
# L7 path routing to two Services that both came from the *same* chart,
# installed twice as releases dev / prod with different values files.
# /dev -> svc/dev, /prod -> svc/prod.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-demo
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /dev
            pathType: Prefix
            backend:
              service:
                name: dev
                port:
                  number: 80
          - path: /prod
            pathType: Prefix
            backend:
              service:
                name: prod
                port:
                  number: 80
