services:
  hello:
    build: ../app
    image: hello:v1
    ports:
      - "8080:8080"
    environment:
      MESSAGE: "Hello from compose"
      DB_HOST: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  pgdata: {}
