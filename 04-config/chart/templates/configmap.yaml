# Filename matters here: the checksum/config annotation trick in
# TUTORIAL-OUTLINE.md's 附录 A 第 2 条 hashes this file by its template
# path — that's the follow-up to add live, once the "Pod doesn't restart"
# pitfall below has landed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-config
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
