{{- if .Values.db.enabled }}
{{- $secretName := printf "%s-db" (include "chart.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := .Values.db.password }}
{{- if not $password }}
  {{- if $existing }}
    {{/* Reuse whatever password is already live instead of generating a
         new one on every render — otherwise a later `helm upgrade` would
         hand the app a password Postgres was never told about, breaking
         auth against data a previous PVC already has on disk. */}}
    {{- $password = index $existing.data "password" | b64dec }}
  {{- else }}
    {{- $password = randAlphaNum 16 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $password | b64enc }}
{{- end }}
